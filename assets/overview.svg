<title id="title">Efficient cascaded masked image modeling: MTP resource evaluation</title>
<desc id="description">Text conditions feature diffusion C and masked-token B, followed by frozen VQ decoding. The grown generator has33.31 million learned parameters and1.63 GiB peak generation allocation, versus368.92 million and4.30GiB for dense. One training seed and unequal budgets.</desc>
